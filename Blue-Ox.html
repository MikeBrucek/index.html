<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Ox 2026 Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4A843;
            --gold-light: #F0C96A;
            --dark: #1a1208;
            --card-bg: rgba(15, 10, 3, 0.72);
            --card-border: rgba(212, 168, 67, 0.35);
        }

        body {
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* =====================================================
           BACKGROUND PHOTO — swap the filename below to change
           Uploaded options: bg1.jpg | bg2.jpg | bg3.jpg
           ===================================================== */
        .bg {
            position: fixed;
            inset: 0;
            background-image: url('bg1.jpg');   /* <-- CHANGE THIS LINE */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }

        /* Dark gradient overlay so text stays readable over any photo */
        .bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                160deg,
                rgba(10, 7, 2, 0.55) 0%,
                rgba(10, 7, 2, 0.45) 50%,
                rgba(10, 7, 2, 0.65) 100%
            );
        }

        /* Grain texture overlay for that festival-poster feel */
        .grain {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: 0.06;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Card */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 860px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 60px 50px 55px;
            box-shadow:
                0 0 0 1px rgba(212, 168, 67, 0.1),
                0 40px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(212, 168, 67, 0.2);
            animation: fadeUp 1s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Top decorative rule */
        .ornament {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            animation: fadeUp 1s 0.1s ease both;
        }

        .ornament-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-diamond {
            width: 8px;
            height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            color: var(--gold-light);
            font-size: clamp(2em, 5vw, 3.4em);
            font-weight: 900;
            letter-spacing: 0.03em;
            line-height: 1.1;
            margin-bottom: 14px;
            text-shadow: 0 2px 20px rgba(212, 168, 67, 0.3);
            animation: fadeUp 1s 0.2s ease both;
        }

        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: clamp(0.95em, 2.5vw, 1.2em);
            font-weight: 300;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 50px;
            animation: fadeUp 1s 0.3s ease both;
        }

        /* Countdown tiles */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            animation: fadeUp 1s 0.45s ease both;
        }

        .time-unit {
            min-width: 140px;
            flex: 1;
            max-width: 180px;
            padding: 32px 16px 24px;
            border: 1px solid var(--card-border);
            border-radius: 3px;
            background: rgba(0,0,0,0.3);
            position: relative;
            transition: border-color 0.3s;
        }

        .time-unit::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.6;
        }

        .time-unit:hover {
            border-color: rgba(212, 168, 67, 0.6);
        }

        .time-value {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(2.8em, 6vw, 4em);
            font-weight: 700;
            color: #fff;
            display: block;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .time-label {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            margin-top: 12px;
            color: var(--gold);
            font-weight: 700;
            display: block;
        }

        /* Bottom ornament */
        .ornament-bottom {
            margin-top: 44px;
            animation: fadeUp 1s 0.6s ease both;
        }

        /* Completion state */
        .finished {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(1.6em, 4vw, 2.4em);
            color: var(--gold-light);
            font-weight: 700;
            animation: pulse 2.5s ease-in-out infinite;
            padding: 20px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; text-shadow: 0 0 30px rgba(212,168,67,0.5); }
            50%       { opacity: 0.75; text-shadow: 0 0 60px rgba(212,168,67,0.9); }
        }

        @media (max-width: 600px) {
            .container { padding: 40px 20px 36px; }
            .time-unit { min-width: 110px; padding: 22px 10px 18px; }
            .countdown { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div class="grain"></div>

    <div class="container">

        <div class="ornament">
            <div class="ornament-line"></div>
            <div class="ornament-diamond"></div>
            <div class="ornament-line"></div>
        </div>

        <h1>Blue Ox 2026 Countdown</h1>
        <p class="subtitle">Time Until Gates Open!</p>

        <div id="countdown" class="countdown">
            <div class="time-unit">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <div class="ornament-bottom">
            <div class="ornament">
                <div class="ornament-line"></div>
                <div class="ornament-diamond"></div>
                <div class="ornament-line"></div>
            </div>
        </div>

    </div>

    <script>
        function getTargetDate() {
            // June 24, 2026 at 12:00 PM Central Time (CDT = UTC-5)
            return new Date('2026-06-24T12:00:00-05:00');
        }

        function updateCountdown() {
            const now = new Date();
            const target = getTargetDate();
            const difference = target - now;

            if (difference <= 0) {
                document.getElementById('countdown').innerHTML =
                    '<div class="finished">The gates are open. Are you here yet?! 🎉</div>';
                return;
            }

            const days    = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours   = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent    = days;
            document.getElementById('hours').textContent   = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
