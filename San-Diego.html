<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Diego Bubble Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F4FF 55%, #E8D5A3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: linear-gradient(180deg, #fffef8 0%, #fdf6e3 100%);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #5A4A2A;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: 600;
        }

        .target-date {
            color: #8B7355;
            margin-bottom: 40px;
            font-size: 1.2em;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-unit {
            background: linear-gradient(180deg, #5AADDE 0%, #3A8FB5 100%);
            border-radius: 15px;
            padding: 30px 20px;
            min-width: 140px;
            color: white;
            box-shadow: 0 10px 25px rgba(58, 143, 181, 0.3);
        }

        .time-value {
            font-size: 3.5em;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .time-label {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            opacity: 0.9;
        }

        .finished {
            font-size: 3em;
            color: #3A8FB5;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.8em;
            }
            .time-unit {
                min-width: 120px;
                padding: 20px 15px;
            }
            .time-value {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Time Remaining</h1>
        <p class="target-date">Until We Are Beach Bound!</p>

        <div id="countdown" class="countdown">
            <div class="time-unit">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="hours">0</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="minutes">0</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-unit">
                <span class="time-value" id="seconds">0</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>
    </div>

    <script>
        function getTargetDate() {
            const targetDateString = '2026-04-11T07:00:00-06:00';
            return new Date(targetDateString);
        }

        function updateCountdown() {
            const now = new Date();
            const target = getTargetDate();
            const difference = target - now;

            if (difference <= 0) {
                document.getElementById('countdown').innerHTML = '<div class="finished">We Are On our Way! 🎉</div>';
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
